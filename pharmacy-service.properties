# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:pharmacydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Pharmacy Operating Parameters
app.branch-name=Nha Thuoc So 1
app.hotline=1900xxxx

# Dynamic VAT Rate (0.05 = 5%)
pharmacy.vat-rate=0.05

# Warehouse Service URL
warehouse.service.url=http://localhost:8082

# ====================================================================
# [Bài tập 3 & 4] Circuit Breaker cho Warehouse Service (warehouseCB)
# ====================================================================
resilience4j.circuitbreaker.instances.warehouseCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.warehouseCB.sliding-window-size=6
resilience4j.circuitbreaker.instances.warehouseCB.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.warehouseCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouseCB.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.warehouseCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.warehouseCB.automatic-transition-from-open-to-half-open-enabled=true

# ====================================================================
# [Bài tập Rate Limiter & Retry] Xuất hóa đơn điện tử
# ====================================================================
# Rate Limiter: Tối đa 5 hóa đơn trong 10 giây
resilience4j.ratelimiter.instances.invoiceLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.invoiceLimiter.limit-refresh-period=10s
resilience4j.ratelimiter.instances.invoiceLimiter.timeout-duration=0s

# Retry: Thử lại 3 lần, mỗi lần cách nhau 2 giây
resilience4j.retry.instances.invoiceRetry.max-attempts=3
resilience4j.retry.instances.invoiceRetry.wait-duration=2s

# ====================================================================
# [Bài tập Full Resilience] Xác thực thẻ bảo hiểm y tế
# ====================================================================
# TimeLimiter: Tự ngắt sau 3 giây (có thể chỉnh sửa từ xa qua Git)
resilience4j.timelimiter.instances.insuranceTL.timeout-duration=3s
resilience4j.timelimiter.instances.insuranceTL.cancel-running-future=true

# Retry BHYT: Tự động gửi lại request 3 lần nếu gặp lỗi, cách nhau 2 giây
resilience4j.retry.instances.insuranceRetry.max-attempts=3
resilience4j.retry.instances.insuranceRetry.wait-duration=2s

# Circuit Breaker BHYT: Ngắt mạch nếu tỷ lệ timeout/lỗi liên tục vượt quá 60%
resilience4j.circuitbreaker.instances.insuranceCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.insuranceCB.sliding-window-size=6
resilience4j.circuitbreaker.instances.insuranceCB.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.insuranceCB.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.insuranceCB.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.insuranceCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.insuranceCB.automatic-transition-from-open-to-half-open-enabled=true
